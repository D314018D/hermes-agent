<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hermes Local Stack</title>
  <style>
    :root {
      --bg: #f3efe5;
      --panel: #fffaf2;
      --ink: #1d2935;
      --muted: #5f6b76;
      --accent: #ae4b2a;
      --accent-2: #1f6a70;
      --border: #d8c8b5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(174,75,42,0.15), transparent 26%),
        radial-gradient(circle at bottom right, rgba(31,106,112,0.15), transparent 30%),
        var(--bg);
      color: var(--ink);
    }
    .shell {
      max-width: 960px;
      margin: 32px auto;
      padding: 24px;
    }
    .hero {
      background: linear-gradient(135deg, rgba(255,250,242,0.95), rgba(246,235,221,0.92));
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 16px 40px rgba(29, 41, 53, 0.08);
    }
    h1 {
      margin: 0 0 8px;
      font-size: clamp(28px, 4vw, 48px);
    }
    p {
      color: var(--muted);
      line-height: 1.5;
    }
    .grid {
      display: grid;
      grid-template-columns: 1.3fr 1fr;
      gap: 20px;
      margin-top: 20px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 20px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
    }
    textarea, select, input[type="text"] {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      font: inherit;
      background: white;
      color: var(--ink);
    }
    textarea {
      min-height: 160px;
      resize: vertical;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 12px;
    }
    .check {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 14px;
    }
    button {
      margin-top: 16px;
      border: 0;
      background: linear-gradient(135deg, var(--accent), #d06a38);
      color: white;
      padding: 12px 16px;
      border-radius: 14px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    pre {
      white-space: pre-wrap;
      word-break: break-word;
      background: #1d2935;
      color: #f7f4ee;
      border-radius: 16px;
      padding: 16px;
      min-height: 280px;
      overflow: auto;
    }
    .path {
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 13px;
      color: var(--accent-2);
    }
    @media (max-width: 860px) {
      .grid, .row { grid-template-columns: 1fr; }
      .shell { margin: 12px auto; padding: 14px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="hero">
      <div class="path">GUI -> Lightweight Router -> Hermes -> oMLX -> Qwen2.5 / Qwen3.5 / Hermes-2-Pro / Qwen3-TTS</div>
      <h1>Hermes Local Stack</h1>
      <p>Use this page to test the local browser path. Chat routes to Qwen2.5, reasoning routes to Qwen3.5, and agent-style requests route to Hermes-2-Pro.</p>
    </div>

    <div class="grid">
      <div class="card">
        <label for="message">Message</label>
        <textarea id="message" placeholder="Ask something for the local stack...">Please analyze this request and suggest the best local model.</textarea>

        <div class="row">
          <div>
            <label for="source">Source</label>
            <select id="source">
              <option value="gui">GUI</option>
            </select>
          </div>
          <div>
            <label for="capability">Capability</label>
            <select id="capability">
              <option value="chat">Chat</option>
              <option value="reasoning">Reasoning</option>
              <option value="agent">Agent</option>
            </select>
          </div>
        </div>

        <div class="row">
          <div>
            <label for="model_hint">Model Hint</label>
            <input id="model_hint" type="text" placeholder="Optional, e.g. qwen3.5">
          </div>
          <div class="check">
            <input id="tts" type="checkbox">
            <label for="tts">Request TTS path</label>
          </div>
        </div>

        <button id="send">Send Through Router</button>
      </div>

      <div class="card">
        <label>Response</label>
        <pre id="output">Waiting for request...</pre>
      </div>
    </div>
  </div>

  <script>
    const output = document.getElementById("output");
    document.getElementById("send").addEventListener("click", async () => {
      output.textContent = "Sending...";
      const payload = {
        source: document.getElementById("source").value,
        capability: document.getElementById("capability").value,
        model_hint: document.getElementById("model_hint").value,
        tts: document.getElementById("tts").checked,
        message: document.getElementById("message").value
      };

      try {
        const response = await fetch("/api/message", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const data = await response.json();
        output.textContent = JSON.stringify(data, null, 2);
      } catch (error) {
        output.textContent = String(error);
      }
    });
  </script>
</body>
</html>
