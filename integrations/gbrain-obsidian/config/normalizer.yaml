normalizer:
  log_raw_content: false
  stable_message_ids: true
  supported_input_types:
    - text
    - audio
    - image
    - document
    - video
    - mixed
  telegram_commands:
    - search
    - save
    - review
    - approve
    - reject
    - status
  language_detection:
    simple: true
    supported:
      - en
      - zh
