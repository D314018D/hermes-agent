# Merge these ideas into ~/.hermes/config.yaml after enabling project plugins.
# Do not replace the whole file blindly.

plugins:
  enabled:
    - obsidian-gbrain

toolsets:
  - hermes-cli
  - obsidian-gbrain

# For Open WebUI, enable Hermes' official API server rather than calling
# scripts/hermes_dispatch.py from the UI.
# API_SERVER_ENABLED and API_SERVER_KEY should be set with:
#   hermes config set API_SERVER_ENABLED true
#   hermes config set API_SERVER_KEY <local-secret>

# For project-local plugins, start Hermes with:
#   HERMES_ENABLE_PROJECT_PLUGINS=true
#   HERMES_OBSIDIAN_GBRAIN_ROOT=/Users/rl_home/Documents/Codex/hermes-gbrain-obsidian-starter
