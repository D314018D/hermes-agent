interface:
  mode: "qwen_brain_router"
  router_model: "Qwen3.5-4B-OptiQ-4bit"
  router_base_url: "http://127.0.0.1:8000/v1"
  default_route: "direct_qwen"
  rule_based_routing: true
  llm_router: true

policy:
  description: "Qwen is the first-pass brain. WebUI asks local Qwen/OMLX for a routing JSON first, then falls back to deterministic rules if the local router is unavailable."

routes:
  direct_qwen:
    model: "Qwen3.5-4B-OptiQ-4bit"
    provider: "custom"
    base_url: "http://127.0.0.1:8000/v1"
    use_when: "Normal text chat and simple local reasoning."
  tool_first_gbrain_ingest:
    model: "Qwen3.5-4B-OptiQ-4bit"
    provider: "custom"
    base_url: "http://127.0.0.1:8000/v1"
    tool_entrypoint: "python3 scripts/ingest.py -"
    use_when: "The user asks to save, store, capture, or write durable information; Hermes must hand off to GBrain-controlled ingestion before Obsidian Markdown rendering."
  delegate_hermes_complex:
    model: "Qwen3.5-9B-OptiQ-4bit"
    provider: "custom"
    base_url: "http://127.0.0.1:8000/v1"
    use_when: "Complex multi-step reasoning, debugging, implementation, review, long analysis, or tool-heavy Hermes agent work."
  vision_qwen_vl:
    model: "Qwen3-VL-4B-Instruct-MLX-4bit"
    provider: "custom"
    base_url: "http://127.0.0.1:8000/v1"
    use_when: "Image, screenshot, or visual input."
  tts_qwen:
    model: "Qwen3-TTS-12Hz-0.6B-CustomVoice-8bit"
    provider: "custom"
    base_url: "http://127.0.0.1:8000/v1"
    use_when: "Speech or read-aloud output."

observability:
  jsonl_log: "logs/model-routing.jsonl"
  obsidian_note: "obsidian-vault/06-skills/current-model-routing.md"
